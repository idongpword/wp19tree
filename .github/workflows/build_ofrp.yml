name: OrangeFox Builder

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OFRP Vendor Boot for WP19 Pro
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Free Up Storage Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Install Build Dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses-dev lib32z1-dev libc6-dev-i386 libncurses5 libncurses5-dev libreadline-dev libsqlite3-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 repo

      - name: Sync OrangeFox Source using Official Sync Tool
        run: |
          git config --global user.name "idongpword"
          git config --global user.email "isacryptoemail@gmail.com"
          mkdir -p ~/OrangeFox_sync
          cd ~/OrangeFox_sync
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path ~/ofrp

      - name: Clone Device Tree Into Build Environment
        run: |
          rm -rf ~/ofrp/device/oukitel/WP19_Pro
          mkdir -p ~/ofrp/device/oukitel/WP19_Pro
          cp -r ./* ~/ofrp/device/oukitel/WP19_Pro/

      - name: Compile OrangeFox Recovery (Vendor Boot)
        run: |
          cd ~/ofrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch fox_WP19_Pro-eng
          make vendorbootimage -j$(nproc)

      - name: Upload Built Vendor Boot Image
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-WP19_Pro-VendorBoot
          path: |
            ~/ofrp/out/target/product/WP19_Pro/vendor_boot.img
            ~/ofrp/out/target/product/WP19_Pro/OrangeFox*.zip
